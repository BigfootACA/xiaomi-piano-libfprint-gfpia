# The reader is not a USB or spidev device, so libfprint finds it the way it
# finds any device it cannot enumerate: by being told it is there.
#
# fprintd ships a device allow-list, and neither the trusted environment nor
# the sensor's UIO node is on it, so both have to be added or opening them is
# refused outright. The UIO node is allowed by class rather than by path: its
# minor number is whatever UIO handed out at probe.
#
# The driver also has to be able to drop the sensor's stale detect baseline,
# which lives in the supplicant's state directory; ProtectSystem=strict would
# otherwise make that read-only.
[Unit]
Requires=xiaomi-fingerprint-supplicant.service
After=xiaomi-fingerprint-supplicant.service

[Service]
Environment=FP_XIAOMI_PIANO=1
DeviceAllow=/dev/tee0 rw
DeviceAllow=char-uio rw
ReadWritePaths=/var/lib/xiaomi-fingerprint
